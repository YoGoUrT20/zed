# Fork-only release workflow.
#
# The upstream `release.yml` is generated by `cargo xtask workflows` and is hard-gated to
# `github.repository_owner == 'zed-industries'`, Namespace self-hosted runners, and signing /
# sccache / Sentry / blob-store secrets that forks do not have. This workflow builds the same
# bundles with the same `script/bundle-*` entrypoints, but on GitHub-hosted runners and with
# every secret-dependent step allowed to no-op.
#
# It is hand-written: do not regenerate it with `cargo xtask workflows`.
name: fork_release

on:
  push:
    tags:
      - v*-fork.*
  # Build the bundles without publishing a release: to smoke-test the workflow, or to get
  # a single platform's bundle that cannot be built locally (macOS from a non-Mac host).
  workflow_dispatch:
    inputs:
      platforms:
        description: Which bundles to build
        type: choice
        default: all
        options:
          - all
          - mac
          - linux
          - windows

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: '1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle_mac_aarch64:
    if: >-
      github.repository_owner != 'zed-industries'
      && (github.event_name != 'workflow_dispatch'
          || inputs.platforms == 'all'
          || inputs.platforms == 'mac')
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - name: Checkout repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          check-latest: true
          package-manager-cache: false

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-mac-aarch64-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-mac-aarch64-

      # No MACOS_CERTIFICATE / APPLE_NOTARIZATION_* secrets: script/bundle-mac falls back to
      # ad-hoc signing on its own. The secrets are still passed through so that adding them to
      # the fork later is enough to get real signing and notarization, with no workflow change.
      - name: ./script/bundle-mac aarch64-apple-darwin
        run: ./script/bundle-mac aarch64-apple-darwin
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
          APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
          APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}

      - name: Upload Zed-aarch64.dmg
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Zed-aarch64.dmg
          path: target/aarch64-apple-darwin/release/Zed-aarch64.dmg
          if-no-files-found: error

      - name: Upload zed-remote-server-macos-aarch64.gz
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: zed-remote-server-macos-aarch64.gz
          path: target/zed-remote-server-macos-aarch64.gz
          if-no-files-found: error

  bundle_linux_x86_64:
    if: >-
      github.repository_owner != 'zed-industries'
      && (github.event_name != 'workflow_dispatch'
          || inputs.platforms == 'all'
          || inputs.platforms == 'linux')
    # 22.04 rather than ubuntu-latest: the bundle links against the runner's glibc, so the
    # oldest image GitHub still hosts gives the widest distro compatibility.
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      CC: clang
      CXX: clang++
    steps:
      - name: Checkout repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      # Hosted runners ship with little free space; a full release build of the workspace
      # needs considerably more than what the image leaves behind.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift "${AGENT_TOOLSDIRECTORY:-}"
          df -h /

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-linux-x86_64-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-linux-x86_64-

      - name: ./script/linux
        run: ./script/linux

      - name: ./script/download-wasi-sdk
        run: ./script/download-wasi-sdk

      # script/bundle-linux calls `llvm-objcopy` unversioned; Ubuntu's llvm packages only
      # guarantee the versioned name.
      - name: Ensure llvm-objcopy is on PATH
        run: |
          if ! command -v llvm-objcopy >/dev/null 2>&1; then
            versioned=$(ls -1 /usr/bin/llvm-objcopy-* 2>/dev/null | sort -V | tail -1)
            if [ -z "$versioned" ]; then
              echo "no llvm-objcopy found" >&2
              exit 1
            fi
            sudo ln -sf "$versioned" /usr/local/bin/llvm-objcopy
          fi
          llvm-objcopy --version

      - name: ./script/bundle-linux
        run: ./script/bundle-linux

      - name: Upload zed-linux-x86_64.tar.gz
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: zed-linux-x86_64.tar.gz
          path: target/release/zed-linux-x86_64.tar.gz
          if-no-files-found: error

      - name: Upload zed-remote-server-linux-x86_64.gz
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: zed-remote-server-linux-x86_64.gz
          path: target/zed-remote-server-linux-x86_64.gz
          if-no-files-found: error

  bundle_windows_x86_64:
    if: >-
      github.repository_owner != 'zed-industries'
      && (github.event_name != 'workflow_dispatch'
          || inputs.platforms == 'all'
          || inputs.platforms == 'windows')
    # 2025 rather than 2022: script/bundle-windows.ps1 hardcodes Windows SDK 10.0.26100 for
    # makeappx.exe, which only the 2025 image ships.
    runs-on: windows-2025
    timeout-minutes: 360
    steps:
      - name: Checkout repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-windows-x86_64-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-windows-x86_64-

      # script/bundle-windows.ps1 hardcodes the VS 2022 Community path for Launch-VsDevShell.ps1;
      # hosted runners install Enterprise. A junction is cheaper than patching the script.
      - name: Alias the installed Visual Studio 2022 as Community
        shell: pwsh
        run: |
          $community = 'C:\Program Files\Microsoft Visual Studio\2022\Community'
          if (-not (Test-Path $community)) {
            $installed = Get-ChildItem 'C:\Program Files\Microsoft Visual Studio\2022' -Directory |
              Select-Object -First 1
            if (-not $installed) { throw 'no Visual Studio 2022 installation found' }
            New-Item -ItemType Junction -Path $community -Target $installed.FullName | Out-Null
          }
          Get-Item "$community\Common7\Tools\Launch-VsDevShell.ps1" | Select-Object FullName

      - name: Ensure Inno Setup is installed
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          Get-Item $iscc | Select-Object FullName

      # ParseZedWorkspace runs `cargo metadata --offline`, which needs a populated registry.
      - name: cargo fetch
        shell: pwsh
        run: cargo fetch

      # As on macOS: with no AZURE_SIGNING_* secrets, CheckEnvironmentVariables leaves
      # $canCodeSign false and every signing step is skipped.
      - name: script/bundle-windows.ps1 -Architecture x86_64
        shell: pwsh
        run: script/bundle-windows.ps1 -Architecture x86_64
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_SIGNING_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_SIGNING_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_SIGNING_CLIENT_SECRET }}
          ACCOUNT_NAME: ${{ vars.AZURE_SIGNING_ACCOUNT_NAME }}
          CERT_PROFILE_NAME: ${{ vars.AZURE_SIGNING_CERT_PROFILE_NAME }}
          ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          FILE_DIGEST: SHA256
          TIMESTAMP_DIGEST: SHA256
          TIMESTAMP_SERVER: http://timestamp.acs.microsoft.com

      - name: Upload Zed-x86_64.exe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Zed-x86_64.exe
          path: target/Zed-x86_64.exe
          if-no-files-found: error

      - name: Upload zed-remote-server-windows-x86_64.zip
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: zed-remote-server-windows-x86_64.zip
          path: target/zed-remote-server-windows-x86_64.zip
          if-no-files-found: error

  publish_release:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - bundle_mac_aarch64
      - bundle_linux_x86_64
      - bundle_windows_x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: artifacts

      - name: List artifacts
        run: ls -lR artifacts

      - name: Create release
        run: |
          notes=target/release-notes.md
          mkdir -p target
          cat > "$notes" <<NOTES
          Unofficial build of [${GITHUB_REPOSITORY}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}), a fork of [zed-industries/zed](https://github.com/zed-industries/zed).

          Built from \`${GITHUB_SHA}\` on the \`dev\` release channel.

          ## Downloads

          - macOS (Apple Silicon): \`Zed-aarch64.dmg\`
          - Linux (x86_64): \`zed-linux-x86_64.tar.gz\`
          - Windows (x86_64): \`Zed-x86_64.exe\`

          The \`zed-remote-server-*\` files are for [remote development](https://zed.dev/docs/remote-development); desktop users do not need them.

          ## These binaries are not code signed

          macOS is ad-hoc signed and Windows is unsigned, so both will refuse to launch them on first run.

          - macOS: right-click the app and choose Open, or run \`xattr -dr com.apple.quarantine "/Applications/Zed Dev.app"\`.
          - Windows: on the SmartScreen prompt, choose More info, then Run anyway.

          Auto-update does not point at this repository; install new versions from this releases page.
          NOTES
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$notes" \
            --prerelease \
            artifacts/*
        env:
          GITHUB_TOKEN: ${{ github.token }}
